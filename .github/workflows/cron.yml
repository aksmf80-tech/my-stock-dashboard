name: Naver Stock Data Crawler

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly yfinance beautifulsoup4 requests streamlit

      - name: Run Crawler Engine
        run: python fetch_data.py

      # 🎯 [이름표 고정] 문자열 꼬임 현상을 완전히 차단하고 정품 이름인 theme_data.csv로 무조건 강제 푸시합니다.
      - name: Commit and Force Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add theme_data.csv
          git commit -m "🔄 [글로벌 해방] 정품 이름으로 실시간 데이터 전면 갱신 완료" || echo "No changes"
          git push origin main --force
