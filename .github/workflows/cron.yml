name: Naver Stock Data Crawler

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly pykrx beautifulsoup4 requests streamlit>=1.37.0

      - name: Run Crawler Engine
        run: python fetch_data.py

      # 🎯 [0.0 지옥 완전 종결 핵심]
      # 깃허브 추적 오류를 완전히 우회하기 위해, 파일 변경을 감지하지 않고 
      # 무조건 강제로(Force) 파일을 저장소에 등록하고 main 브랜치에 밀어 넣습니다.
      - name: Commit and Force Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # 강제로 파일 추적을 밀어붙이는 파이프라인
          git add -A
          git commit -m "🔄 [실시간 해방] 진짜 당일 주가 퍼센트 데이터 전면 갱신 완료" || echo "No changes"
          git push origin main --force
