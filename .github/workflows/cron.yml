name: Naver Stock Data Crawler

on:
  schedule:
    # 🕒 한국 시간 월~금, 오전 9시~오후 4시까지 매 1분마다 자동 실행!
    - cron: '* 0-7 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 코드를 가져옵니다
      uses: actions/checkout@v3

    - name: 2. 파이썬을 설치합니다
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 필수 패키지를 설치합니다
      run: |
        pip install pandas requests beautifulsoup4

    - name: 4. 크롤러 코드를 실행해서 데이터를 갱신합니다
      run: python fetch_data.py

    - name: 5. 변경된 데이터를 내 깃허브에 자동으로 저장합니다
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add theme_data.csv
        git commit -m "자동 데이터 업데이트" || exit 0
        git push
