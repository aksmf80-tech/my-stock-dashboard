name: Naver Stock Data Crawler

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly pykrx beautifulsoup4 requests streamlit>=1.37.0

      - name: Run Crawler Engine
        run: python fetch_data.py

      # 🎯 [0.0 지옥 완전 종결 핵심]
      # 파일이 삭제되어 없는 상태이더라도, 무조건 새로 생성해서 강제로 레포지토리에 밀어 넣습니다.
      - name: Commit and Force Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # theme_data.csv 파일이 정상적으로 만들어졌는지 확인 후 강제 추가
          if [ -f theme_data.csv ]; then
            git add theme_data.csv
            git commit -m "🔄 [실시간 해방] 진짜 당일 주가 퍼센트 데이터 최초 생성 완료" || echo "No changes"
            git push origin main --force
          else
            echo "❌ 파이썬 실행 오류로 파일이 생성되지 않았습니다."
            exit 1
          fi
