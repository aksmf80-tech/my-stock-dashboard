name: Naver Stock Data Crawler

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🎯 [핵심 교정 1] 라이브러리 설치는 설치만 깔끔하게 끝내도록 분리합니다.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly yfinance beautifulsoup4 requests streamlit

      # 🎯 [핵심 교정 2] 딴짓하지 않고 오직 주식 수집기 파일만 순수하게 가동시킵니다.
      - name: Run Crawler Engine
        run: python fetch_data.py

      # 🎯 [핵심 교정 3] 생성된 데이터의 이름표를 정품 규격인 theme_data.csv로 박아 강제 푸시합니다.
      - name: Commit and Force Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add theme_data.csv
          git commit -m "🔄 [글로벌 해방] 정품 테마 데이터 실시간 전면 갱신 완료" || echo "No changes"
          git push origin main --force
