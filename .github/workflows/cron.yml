name: Yahoo Stock Data Refresher

on:
  schedule:
    # 🎯 [장중 5분 최속 가속 패치] 월~금, 한국시간 오전 9시 0분부터 오후 4시 55분까지 '5분마다' 귀신같이 기동
    # (UTC 기준 0시부터 7시까지 매 5분마다 깃허브 크롤러 서버를 깨웁니다.)
    - cron: '*/5 0-7 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler Engine
        run: |
          python fetch_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add theme_data.csv
          git add realtime_theme_status.csv
          
          if ! git diff --cached --quiet; then
            git commit -m "📊 [장중 5분 라이브] 오늘의 테마/종목 뼈대 가속 업데이트 완료"
            git push origin main
          else
            echo "변경 사항이 없어 푸시를 건너뜁니다."
          fi
