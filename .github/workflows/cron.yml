name: Yahoo Stock Data Refresher

on:
  schedule:
    # 🎯 월~금, 한국시간 오전 9시부터 오후 4시까지 '5분마다' 최속 기동
    - cron: '*/5 0-7 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler Engine
        run: |
          python fetch_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # 🚨 [KeyError/Pathspec 버그 완전 격파] 파일이 새로 생성되어도 에러 없이 싹 다 긁어모아 커밋하도록 수정
          git add theme_data.csv
          git add realtime_theme_status.csv || echo "대기"
          
          if ! git diff --cached --quiet; then
            git commit -m "📊 [장중 5분 라이브] 150선 핫종목 뼈대 갱신 완료"
            git push origin main
          else
            echo "변경 사항이 없어 푸시를 건너뜁니다."
          fi
