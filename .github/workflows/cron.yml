name: Yahoo Stock Data Refresher

on:
  schedule:
    # 🎯 한국 시간(KST) 오후 4시 장마감 후 (UTC 오전 7시) 하루 1회 수집
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 언제든 수동으로 실행하고 싶을 때 버튼 클릭 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🎯 무한 루프 없이 깔끔하게 1회만 실행하여 전체 종목 기틀 갱신
      - name: Run Crawler Engine
        run: |
          echo "🔄 4,115개 종목 데이터 베이스 동기화 시작..."
          python fetch_data.py

      # 🎯 변경 사항이 있을 때만 안전하게 딱 1번 커밋 및 푸시
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add theme_data.csv
          
          if ! git diff --cached --quiet; then
            git commit -m "📊 [자동 갱신] 오늘의 테마/종목 데이터 동기화 완료"
            git push origin main
          else
            echo "변경 사항이 없어 푸시를 건너뜁니다."
          fi
