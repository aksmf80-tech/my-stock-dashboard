name: Naver Stock Data Crawler

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler Engine
        run: python fetch_data.py

      # 🎯 족쇄를 완전히 끊고 무조건 강제로 내 저장소에 덮어쓰기(Push)를 집행합니다.
      - name: Commit and Force Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add theme_data.csv
          git commit -m "🔄 [강제 동기화] 실시간 주가 데이터 강제 갱신" || echo "No changes to commit"
          git push origin main
