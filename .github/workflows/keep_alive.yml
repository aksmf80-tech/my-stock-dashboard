name: Keep Streamlit App Alive

on:
  schedule:
    # 🎯 [수정] 10시간 마다가 아닌, 10분 마다 정상적으로 맥박을 뛰게 만듭니다.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Auto Commit to Reset Streamlit Timer
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        echo "Last check: $(date)" > keep_alive.txt
        git add keep_alive.txt
        
        # 🎯 [수정] Streamlit 서버가 배포 신호를 정상 인식하도록 [skip ci]를 완전히 제거했습니다.
        git commit -m "chore: keep streamlit app alive and kick deploy trigger" || echo "No changes to commit"
        git push origin main
